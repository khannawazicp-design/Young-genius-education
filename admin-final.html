<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YGE Admin FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
.tab{padding:15px;text-align:center;font-weight:bold}
.tab span{padding:10px 20px;border-radius:10px;margin:5px;display:inline-block;cursor:pointer}
.active{background:#facc15;color:#101f3c}.inactive{background:#101f3c;color:#facc15}
.card{background:white;margin:15px;padding:20px;border-radius:15px}
input{width:100%;padding:13px;margin:7px 0;border:1.5px solid #ccc;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:15px;background:#101f3c;color:#facc15;border:0;border-radius:10px;font-weight:bold;font-size:17px}
#prev{width:120px;height:120px;object-fit:cover;border-radius:12px;display:none;border:3px solid #facc15;margin-top:10px}
.up{border:2px dashed #101f3c;background:#fef9c3;padding:20px;text-align:center;border-radius:12px;margin:8px 0}
</style></head><body>

<div class="tab">
<span id="b1" class="active" onclick="show(1)">🏆 Top Student</span>
<span id="b2" class="inactive" onclick="show(2)">📢 News</span>
</div>

<div id="sec1" class="card">
<h3>Top Student Add - Direct Photo</h3>
<input id="n1" placeholder="Student Name *">
<input id="n2" placeholder="Father Name">
<input id="n3" placeholder="School Name">
<input id="n4" type="number" placeholder="Marks">
<input id="n5" type="number" placeholder="Rank - 1,2,3">

<div class="up" onclick="document.getElementById('f').click()">
<span id="tx">📷 Photo Select Karo (Gallery se)</span>
<input type="file" id="f" accept="image/*" hidden>
</div>
<img id="prev">
<input type="hidden" id="url">
<button onclick="addS()">ADD STUDENT</button>
<p id="m1"></p>
</div>

<div id="sec2" class="card" style="display:none">
<h3>News / Elaan</h3>
<input id="news" placeholder="Elaan likho..." style="height:80px">
<button onclick="addN()">PUBLISH NEWS</button>
<p id="m2"></p>
</div>

<script>
const sb=supabase.createClient("https://qesradorkbhgmprpaqve.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlc3JhZG9ya2JoZ21wcnBhcXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTI4ODYsImV4cCI6MjEwNjE4ODg4Nn0.Kw9Ls9KR4KxLfJJ_--vCI141yj_Am_drigyCbl4xAao");
function show(x){document.getElementById('sec1').style.display=x==1?'block':'none';document.getElementById('sec2').style.display=x==2?'block':'none';document.getElementById('b1').className=x==1?'active':'inactive';document.getElementById('b2').className=x==2?'active':'inactive';}
document.getElementById('f').addEventListener('change', async function(){
 let file=this.files[0]; if(!file) return;
 document.getElementById('tx').innerText="Uploading...";
 let name=Date.now()+"_"+file.name;
 let {error}=await sb.storage.from('images').upload(name,file);
 if(error){alert(error.message); return;}
 let {data}=sb.storage.from('images').getPublicUrl(name);
 document.getElementById('url').value=data.publicUrl;
 document.getElementById('prev').src=data.publicUrl;
 document.getElementById('prev').style.display='block';
 document.getElementById('tx').innerText="✅ Photo Ready";
});
async function addS(){
 let d={student_name:document.getElementById('n1').value,father_name:document.getElementById('n2').value,school:document.getElementById('n3').value,marks:parseInt(document.getElementById('n4').value)||0,rank:parseInt(document.getElementById('n5').value)||1,photo_url:document.getElementById('url').value};
 if(!d.student_name||!d.photo_url){alert("Naam aur Photo zaroori hai");return;}
 let {error}=await sb.from('winners').insert(d);
 document.getElementById('m1').innerText=error?"❌ "+error.message:"✅ Ho Gaya! Website pe dekho";
 if(!error){document.getElementById('n1').value=""; document.getElementById('prev').style.display='none';}
}
async function addN(){
 let msg=document.getElementById('news').value;
 let {error}=await sb.from('announcements').insert({message:msg});
 document.getElementById('m2').innerText=error?"❌ "+error.message:"✅ News Publish Ho Gayi";
}
</script></body></html>
