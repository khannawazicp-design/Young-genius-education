<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YGE Admin</title><style>body{background:#f6f5ef;font-family:Arial;padding:12px}.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px}input,textarea,select{width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px}button{padding:10px;border-radius:8px;border:0;background:#101f3c;color:#fff;font-weight:700;margin-top:8px;width:100%}.del{background:#ef4444}</style></head><body>

</div>
