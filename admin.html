<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YGE Admin</title><style>body{background:#f0f2f5;font-family:Arial;padding:10px}.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px}input,select,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px}button{padding:10px;border:0;border-radius:8px;background:#101f3c;color:#fff;font-weight:700;width:100%;margin-top:8px}.save{background:#facc15;color:#000}.del{background:#ef4444;width:auto;padding:4px 10px;font-size:12px}.item{display:flex;justify-content:space-between;background:#f9fafb;padding:8px;border-radius:8px;margin-top:6px;font-size:13px}</style></head><body>
<div id="login" class="card" style="max-width:340px;margin:60px auto;text-align:center"><h3>YGE Admin</h3><p style="font-size:11px">Password: YGE2026</p><input type="password" id="pass"><button onclick="if(document.getElementById('pass').value==='YGE2026'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load()}else alert('Wrong')">Login</button></div>
<div id="panel" style="display:none">
<div class="card"><h3>Admin Panel</h3><a href="/">Website</a></div>
<div class="card"><h4>🏆 Top Student - Position Wise</h4><select id="s_pos"><option>1st</option><option>2nd</option><option>3rd</option></select><input id="s_name" placeholder="Name e.g Ahmed Ali"><input id="s_class" placeholder="Class e.g 10th"><input id="s_school" placeholder="School"><button class="save" onclick="addS()">Add / Update Student</button><div id="s_list"></div></div>
<div class="card"><h4>🏫 Top School - Position Wise</h4><select id="sc_pos"><option>1st</option><option>2nd</option><option>3rd</option></select><input id="sc_name" placeholder="School Name"><input id="sc_per" placeholder="Result e.g 92%"><button class="save" onclick="addSc()">Add / Update School</button><div id="sc_list"></div></div>
<div class="card"><h4>📰 News - Daily</h4><input type="date" id="n_date"><textarea id="n_text" placeholder="News likhein"></textarea><button class="save" onclick="addN()">Add News</button><div id="n_list"></div></div>
</div>
<script>
let db=JSON.parse(localStorage.getItem('yge_pro')||'{"students":[],"schools":[],"news":[]}');
function save(){localStorage.setItem('yge_pro',JSON.stringify(db));load()}
function addS(){let p=document.getElementById('s_pos').value,n=document.getElementById('s_name').value,c=document.getElementById('s_class').value,sc=document.getElementById('s_school').value;if(!n)return alert('Name likhein');db.students=db.students.filter(x=>x.pos!==p);db.students.push({pos:p,name:n,cls:c,sch:sc});db.students.sort((a,b)=>a.pos.localeCompare(b.pos));save();document.getElementById('s_name').value='';document.getElementById('s_class').value='';document.getElementById('s_school').value=''}
function addSc(){let p=document.getElementById('sc_pos').value,n=document.getElementById('sc_name').value,per=document.getElementById('sc_per').value;if(!n)return alert('School likhein');db.schools=db.schools.filter(x=>x.pos!==p);db.schools.push({pos:p,name:n,per:per});save();document.getElementById('sc_name').value='';document.getElementById('sc_per').value=''}
function addN(){let d=document.getElementById('n_date').value,t=document.getElementById('n_text').value;if(!t)return alert('News likhein');db.news.unshift({date:d,text:t,id:Date.now()});save();document.getElementById('n_text').value=''}
function del(t,id){if(t=='s')db.students=db.students.filter(x=>x.pos!==id);if(t=='sc')db.schools=db.schools.filter(x=>x.pos!==id);if(t=='n')db.news=db.news.filter(x=>x.id!==id);save()}
function load(){document.getElementById('s_list').innerHTML=db.students.map(x=>`<div class=item><span>${x.pos} - ${x.name} (${x.cls})</span><button class=del onclick="del('s','${x.pos}')">Delete</button></div>`).join('');document.getElementById('sc_list').innerHTML=db.schools.map(x=>`<div class=item><span>${x.pos} - ${x.name} ${x.per}</span><button class=del onclick="del('sc','${x.pos}')">Delete</button></div>`).join('');document.getElementById('n_list').innerHTML=db.news.map(x=>`<div class=item><span>${x.date} - ${x.text}</span><button class=del onclick="del('n',${x.id})">Delete</button></div>`).join('')}
</script></body></html>
