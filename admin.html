<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YGE Admin</title><style>body{background:#f6f5ef;font-family:Arial;padding:12px}.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px}input,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px}button{padding:12px;border-radius:8px;border:0;background:#101f3c;color:#fff;font-weight:700;margin-top:8px;width:100%;font-size:15px}button.save{background:#facc15;color:#000}</style></head><body>
<div id="login" class="card" style="max-width:350px;margin:80px auto;text-align:center"><h2>YGE Admin</h2><p style="font-size:12px">Password: YGE2026</p><input type="password" id="pass" placeholder="Password likhein"><button onclick="login()">Login</button></div>
<div id="panel" style="display:none"><div class="card"><h3>Admin Panel</h3><a href="/">← Website Dekhein</a></div><div class="card"><h4>Top Student Likhein</h4><textarea id="st" rows="4">🥇 Ahmed Ali - 10th - 1st
🥈 Fatima Khan - 9th - 2nd</textarea></div><div class="card"><h4>Top School Likhein</h4><textarea id="sc" rows="4">🥇 Govt High School Lahore - 92%</textarea></div><div class="card"><h4>News Likhein</h4><textarea id="nw" rows="4">28 Sep: Competition Announced</textarea></div><div class="card"><button class="save" onclick="save()">💾 SAVE - Website par dikhega</button><p id="msg" style="display:none;color:green;text-align:center">Saved! Ho gaya</p></div></div>
<script>
function login(){if(document.getElementById('pass').value==='YGE2026'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block'}else alert('Password galat hai! YGE2026 likhein')}
function save(){let d={students:document.getElementById('st').value.split('\n'),schools:document.getElementById('sc').value.split('\n'),news:document.getElementById('nw').value.split('\n')};localStorage.setItem('yge_db',JSON.stringify({"2026":d}));document.getElementById('msg').style.display='block';setTimeout(()=>document.getElementById('msg').style.display='none',2000)}
</script></body></html>
