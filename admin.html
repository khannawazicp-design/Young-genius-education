<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YGE Admin Pro</title>
<style>
body{background:#eef2f7;font-family:Arial;padding:10px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px}
button{padding:11px;border:0;border-radius:8px;font-weight:700;width:100%;margin-top:8px}
.save{background:#facc15;color:#000}
.del{background:#ef4444;color:#fff;width:auto;padding:4px 12px;font-size:12px}
.item{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px;border-radius:8px;margin-top:6px;font-size:13px;border:1px solid #eee}
</style>
</head>
<body>

<div id="login" class="card" style="max-width:350px;margin:70px auto;text-align:center">
<h3>YGE Admin Login</h3>
<input type="password" id="pass" placeholder="Password: YGE2026">
<button style="background:#101f3c;color:#fff" onclick="checkPass()">Login</button>
</div>

<div id="panel" style="display:none">
<div class="card"><h3>YGE Admin</h3><a href="/">← Website Dekhein</a></div>

<div class="card">
<h4>Top Student</h4>
<select id="s_pos">
<option value="1st">1st Position</option>
<option value="2nd">2nd Position</option>
<option value="3rd">3rd Position</option>
</select>
<input id="s_name" placeholder="Student Name">
<input id="s_class" placeholder="Class">
<input id="s_school" placeholder="School Name">
<button class="save" onclick="addS()">Add / Update Student</button>
<div id="s_list"></div>
</div>

<div class="card">
<h4>Top School</h4>
<select id="sc_pos">
<option value="1st">1st Position</option>
<option value="2nd">2nd Position</option>
<option value="3rd">3rd Position</option>
</select>
<input id="sc_name" placeholder="School Name">
<input id="sc_res" placeholder="Result">
<button class="save" onclick="addSc()">Add / Update School</button>
<div id="sc_list"></div>
</div>

<div class="card">
<h4>Daily News</h4>
<input type="date" id="n_date">
<input id="n_title" placeholder="News Title">
<textarea id="n_text" placeholder="Mukammal News"></textarea>
<button class="save" onclick="addN()">Add News</button>
<div id="n_list"></div>
</div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('YGE_FINAL_DB') || '{"students":[],"schools":[],"news":[]}');

function checkPass(){
  let p = document.getElementById('pass').value;
  if(p === 'YGE2026'){
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    load();
  } else {
    alert('Wrong Password');
  }
}

function save(){
  localStorage.setItem('YGE_FINAL_DB', JSON.stringify(db));
  load();
}

function addS(){
  let pos = document.getElementById('s_pos').value;
  let name = document.getElementById('s_name').value;
  let cls = document.getElementById('s_class').value;
  let sch = document.getElementById('s_school').value;
  if(!name){ alert('Name likhein'); return; }
  db.students = db.students.filter(x => x.pos !== pos);
  db.students.push({pos:pos, name:name, cls:cls, sch:sch});
  save();
  document.getElementById('s_name').value='';
  document.getElementById('s_class').value='';
  document.getElementById('s_school').value='';
}

function addSc(){
  let pos = document.getElementById('sc_pos').value;
  let name = document.getElementById('sc_name').value;
  let res = document.getElementById('sc_res').value;
  if(!name){ alert('School likhein'); return; }
  db.schools = db.schools.filter(x => x.pos !== pos);
  db.schools.push({pos:pos, name:name, res:res});
  save();
  document.getElementById('sc_name').value='';
  document.getElementById('sc_res').value='';
}
